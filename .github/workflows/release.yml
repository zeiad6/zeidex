name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ORT_VERSION: 1.30.0
  PDFIUM_TAG: chromium%2F8165

jobs:
  bundle:
    name: ${{ matrix.name }} bundles
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            unzip \
            xdg-utils

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Download OCR models
        shell: bash
        run: ./scripts/fetch_models.sh

      - name: Stage runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ort.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/${ORT_VERSION}"
          unzip -q /tmp/ort.nupkg 'runtimes/linux-x64/native/libonnxruntime.so' -d /tmp/ort
          install -m 0755 /tmp/ort/runtimes/linux-x64/native/libonnxruntime.so \
            src-tauri/resources/lib/libonnxruntime.so
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
          tar -xzf /tmp/pdfium.tgz -C /tmp
          install -m 0755 /tmp/lib/libpdfium.so src-tauri/resources/lib/libpdfium.so

      - name: Stage runtime libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/lib | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$env:ORT_VERSION" -OutFile ort.zip
          tar -xf ort.zip -C .
          Copy-Item runtimes/win-x64/native/onnxruntime.dll src-tauri/resources/lib/onnxruntime.dll
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/$env:PDFIUM_TAG/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          tar -xzf pdfium.tgz -C .
          Copy-Item bin/pdfium.dll src-tauri/resources/lib/pdfium.dll

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<ZEIDEX_RELEASE_BODY'
            cat RELEASE_NOTES.md
            echo 'ZEIDEX_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Zeidex Studio {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          tauriScript: npx --prefix app tauri
          args: --bundles ${{ matrix.bundles }}

      # tauri-cli appends a hard `libgtk-3-0` dependency after the configured
      # list; that name has no candidate on Ubuntu 24.04+/Debian 13, where the
      # time_t transition renamed it to libgtk-3-0t64. Rewrite the control file
      # before anything installs or uploads the artifact.
      - name: Repair the deb dependency list
        if: runner.os == 'Linux'
        run: ./scripts/fix-deb-depends.sh src-tauri/target/release/bundle/deb/*.deb

      # The bundle is installed, not just built: a wrong dependency name (for
      # example `libgtk-3-0` on a distro that renamed it to `libgtk-3-0t64`)
      # only shows up when dpkg resolves it against the archive.
      - name: Install the package and verify registration (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          dpkg -s zeidex-studio | grep -E '^(Status|Version):'
          test -x /usr/bin/zeidex
          test -f "/usr/lib/Zeidex Studio/models/ppocrv4_det.onnx"
          test -f "/usr/lib/Zeidex Studio/lib/libonnxruntime.so"

      # tauri-action already attached the pre-repair deb to the draft release;
      # replace it so the published artifact is the installable one.
      - name: Replace the deb in the draft release
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/deb/*.deb --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeidex-${{ matrix.name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
