name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep in step with .github/workflows/release.yml.
  PDFIUM_TAG: chromium%2F8165

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --manifest-path core/Cargo.toml -- --check

      - name: Clippy (production paths deny unwrap/expect)
        run: >-
          cargo clippy --workspace --lib --manifest-path core/Cargo.toml
          -- -D clippy::unwrap_used -D clippy::expect_used

      - name: Test
        run: cargo test --workspace --manifest-path core/Cargo.toml

  ocr-models:
    name: OCR real-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: third_party/models
          key: ocr-models-${{ hashFiles('third_party/models/SHA256SUMS') }}

      - name: Download models
        run: ./scripts/fetch_models.sh

      - name: Verify model checksums
        run: sha256sum -c third_party/models/SHA256SUMS

      # The `ort` crate is built with `load-dynamic`, so the runtime is not
      # linked at build time and has to be present for the tests. The GitHub
      # release has no binary assets any more, so take the official NuGet
      # package (same Microsoft-signed binaries).
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.nupkg \
            https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/1.30.0
          unzip -q /tmp/ort.nupkg 'runtimes/linux-x64/native/libonnxruntime.so' -d /tmp/ort
          echo "ORT_DYLIB_PATH=/tmp/ort/runtimes/linux-x64/native/libonnxruntime.so" >> "$GITHUB_ENV"

      # The PDF test exercises pdfium, which is also loaded dynamically and is
      # staged next to the executable by the release workflow.
      - name: Install pdfium
        run: |
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
          tar -xzf /tmp/pdfium.tgz -C /tmp
          echo "ZEIDEX_TEST_PDFIUM_LIB=/tmp/lib/libpdfium.so" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: core

      - name: Detect, recognize, lay out, decode, render a PDF and export
        env:
          ZEIDEX_TEST_MODELS_DIR: ${{ github.workspace }}/third_party/models
          ZEIDEX_TEST_IMAGE: ${{ github.workspace }}/core/ocr_engine/tests/fixtures/table.png
          ZEIDEX_TEST_TABLE_IMAGE: ${{ github.workspace }}/core/ocr_engine/tests/fixtures/table.png
          ZEIDEX_TEST_PDF: ${{ github.workspace }}/core/ocr_engine/tests/fixtures/table.pdf
        run: |
          cargo test --manifest-path core/Cargo.toml -p zeidex-ocr \
            --test ocr_smoke --test layout_smoke --test table_smoke --test ocr_accuracy \
            --test pdf_smoke
          cargo test --manifest-path core/Cargo.toml -p zeidex-exporter \
            --test export ocr_output_exports_to_word_and_excel

  desktop-linux:
    name: Desktop shell (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Frontend unit tests
        run: npm test
        working-directory: app

      - name: Clippy shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Shell unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  desktop-windows:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Check shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
