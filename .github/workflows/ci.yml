name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: core

      - name: Format
        run: cargo fmt --all --manifest-path core/Cargo.toml -- --check

      - name: Clippy (production paths deny unwrap/expect)
        run: >-
          cargo clippy --workspace --lib --manifest-path core/Cargo.toml
          -- -D clippy::unwrap_used -D clippy::expect_used

      - name: Test
        run: cargo test --workspace --manifest-path core/Cargo.toml

  ocr-models:
    name: OCR real-model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: third_party/models
          key: ocr-models-${{ hashFiles('third_party/models/SHA256SUMS') }}

      - name: Download models
        run: ./scripts/fetch_models.sh

      - name: Verify model checksums
        run: sha256sum -c third_party/models/SHA256SUMS

      # The `ort` crate is built with `load-dynamic`, so the runtime is not
      # linked at build time and has to be present for the tests.
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
          tar -xzf /tmp/ort.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-1.30.0/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: core

      - name: Detect, recognize, lay out and decode a real page
        env:
          ZEIDEX_TEST_MODELS_DIR: ${{ github.workspace }}/third_party/models
          ZEIDEX_TEST_IMAGE: ${{ github.workspace }}/core/ocr_engine/tests/fixtures/table.png
          ZEIDEX_TEST_TABLE_IMAGE: ${{ github.workspace }}/core/ocr_engine/tests/fixtures/table.png
        run: >-
          cargo test --manifest-path core/Cargo.toml -p zeidex-ocr
          --test ocr_smoke --test layout_smoke --test table_smoke

  desktop-linux:
    name: Desktop shell (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Clippy shell
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  desktop-windows:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Check shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
