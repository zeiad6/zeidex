version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/core"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"
    target-branch: "main"
    ignore:
      - dependency-name: "tokio"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"
    target-branch: "main"
    ignore:
      - dependency-name: "tokio"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      frontend:
        patterns:
          - "react"
          - "react-dom"
          - "@tauri-apps/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "vite"
          - "@vitejs/*"
          - "typescript"
    labels:
      - "dependencies"
      - "frontend"
    target-branch: "main"
