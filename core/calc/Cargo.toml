[package]
name = "zeidex-calc"
description = "Launcher calculator: expression intent detection and evaluation."
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version = "0.1.0"

[dependencies]
# `Calculation` is the wire shape the shell serializes, so it is derived here
# rather than restated in the transport layer.
serde = { version = "1", features = ["derive"] }
