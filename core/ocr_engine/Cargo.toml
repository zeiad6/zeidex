[package]
name = "zeidex-ocr"
description = "Offline ONNX document AI: layout, table structure, Arabic/English OCR and BiDi."
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
# Legacy code pages for plain-text documents. Already in the tree through
# `reqwest`, so this adds no crate; it replaces a hand-rolled decoder that would
# have been wrong for every Arabic Windows file.
encoding_rs = "0.8"
image = "0.25"
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "half",
    "load-dynamic",
    "ndarray",
] }
pdfium-render = "0.9.5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-bidi = "0.3"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The pack smoke test resolves a downloaded pack through the same catalog the
# installer writes, so the layout it exercises is the real one.
tempfile = "3"
zeidex-matching = { path = "../matching" }
zeidex-models = { path = "../models" }

[features]
default = []
# Hardware acceleration is opt-in: the default build runs on CPU and loads the
# ONNX Runtime shared library dynamically, so no GPU runtime is required.
cuda = ["ort/cuda"]
directml = ["ort/directml"]
