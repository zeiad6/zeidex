[package]
name = "zeidex-answers"
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Cloud-backed Google Translate. Off by default: the document/OCR pipeline is
# offline-only, and the launcher must never silently depend on the network.
# Enable with `--features translate` for shells that want the `tw"` mode.
translate = []
