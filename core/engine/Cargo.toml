[package]
name = "zeidex-engine"
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version = "0.1.0"

[dependencies]
zeidex-indexing = { path = "../indexing" }
zeidex-matching = { path = "../matching" }
zeidex-ranking = { path = "../ranking" }
zeidex-storage = { path = "../storage" }
zeidex-tools = { path = "../tools" }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unicode-normalization = "0.1"
globset = "0.4.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Bundle metadata is parsed from Info.plist / InfoPlist.strings with `plist`,
# so no Objective-C runtime linkage is needed and the module builds anywhere.
plist = "1.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
