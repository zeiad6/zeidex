[workspace]
members = [
  "answers",
  "batch",
  "calc",
  "engine",
  "exporter",
  "indexing",
  "matching",
  "models",
  "ocr_engine",
  "ranking",
  "storage",
  "tools",
]
resolver = "2"

[workspace.package]
# Let chains (`if let ... && ...`) are used across the core; they stabilized in
# 1.88, so edition 2024 alone is not enough to build this.
rust-version = "1.88"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Zeidexsoft"]
version = "0.1.0"
