[package]
name = "zeidex-exporter"
description = "Export a recognized Zeidex page layout to editable .docx and .xlsx."
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version = "0.1.0"

[dependencies]
docx-rs = "0.4.22"
zeidex-ocr = { path = "../ocr_engine" }
rust_xlsxwriter = "0.103"
thiserror = "2"
zip = "8"

[dev-dependencies]
tempfile = "3"
