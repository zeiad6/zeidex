[package]
name = "zeidex"
version = "0.3.0"
description = "Zeidex Search — offline file search, OCR and document AI"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Zeidexsoft"]

[lib]
# The lib is the Tauri entry point; the binary just calls it. Tauri links it as
# an rlib, so no staticlib/cdylib artifacts are built (the old C-ABI bridge that
# needed them lives in legacy/bridge-ffi).
name = "zeidex_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Forwarded to the OCR engine. The advisor only claims GPU acceleration when
# the build can actually use it and a GPU was detected.
cuda = ["zeidex-ocr/cuda"]
directml = ["zeidex-ocr/directml"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

# `translate` is the `tr"` mode: the launcher's only network feature, off in
# the core by default so the OCR/document pipeline stays offline-only.
zeidex-answers = { path = "../core/answers", features = ["translate"] }
zeidex-batch = { path = "../core/batch" }
zeidex-calc = { path = "../core/calc" }
zeidex-engine = { path = "../core/engine" }
zeidex-indexing = { path = "../core/indexing" }
zeidex-models = { path = "../core/models" }
zeidex-ocr = { path = "../core/ocr_engine" }
zeidex-exporter = { path = "../core/exporter" }
zeidex-storage = { path = "../core/storage" }

anyhow = "1"
arboard = "3"
base64 = "0.22"
dirs = "6"
notify = "6"
rayon = "1"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `ShellExecuteW` replaces `cmd /C start`: cmd would split a filename or URL on
# `&`, and a path is user-controlled text. Same crate version the engine already
# links on Windows, so this adds no new dependency to the graph.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Match the core workspace: a small, fast binary. `panic = "unwind"` stays the
# default so a plugin panic cannot abort the process.
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
