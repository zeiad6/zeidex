[package]
name = "zeidex"
version = "0.1.0"
description = "Zeidex Studio — cross-platform launcher and offline document OCR studio"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Zeidexsoft"]

[lib]
# The lib is the Tauri entry point; the binary just calls it. Tauri links it as
# an rlib, so no staticlib/cdylib artifacts are built (the old C-ABI bridge that
# needed them lives in legacy/bridge-ffi).
name = "zeidex_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"

# `translate` is the `tr"` mode: the launcher's only network feature, off in
# the core by default so the OCR/document pipeline stays offline-only.
zeidex-answers = { path = "../core/answers", features = ["translate"] }
zeidex-calc = { path = "../core/calc" }
zeidex-engine = { path = "../core/engine" }
zeidex-indexing = { path = "../core/indexing" }
zeidex-ocr = { path = "../core/ocr_engine" }
zeidex-exporter = { path = "../core/exporter" }
zeidex-storage = { path = "../core/storage" }

anyhow = "1"
arboard = "3"
base64 = "0.23"
dirs = "7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
# Match the core workspace: a small, fast binary. `panic = "unwind"` stays the
# default so a plugin panic cannot abort the process.
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
