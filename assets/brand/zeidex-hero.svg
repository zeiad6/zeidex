<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Zeidex Studio">
  <title>Zeidex Studio — offline launcher and document AI</title>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="0.55" stop-color="#080b13"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <mask id="fade">
      <rect width="1200" height="400" fill="url(#vanish)"/>
    </mask>
    <linearGradient id="vanish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>
  <g>
    <rect width="1200" height="400" rx="28" fill="url(#surface)"/>
    <g mask="url(#fade)"><rect width="1200" height="400" rx="28" fill="url(#grid)"/></g>
    <circle cx="150" cy="40" r="260" fill="url(#auroraA)" filter="url(#soft)"/>
    <circle cx="1050" cy="380" r="280" fill="url(#auroraB)" filter="url(#soft)"/>

    <g transform="translate(96 118) scale(2.875)">
      <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="9.25" fill="#0b111c"/>
      <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="9.25" fill="none" stroke="url(#mark)" stroke-opacity="0.6" stroke-width="1.1"/>
      <path d="M10.6 10.4h10.9l-9.5 11.2h10.4" fill="none" stroke="url(#mark)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24.1" cy="8.2" r="1.9" fill="#67e8f9"/>
    </g>

    <text x="216" y="228" font-family="Inter" font-size="82" font-weight="700" letter-spacing="2" fill="#f8fafc">ZEIDEX</text>
    <text x="220" y="264" font-family="Inter" font-size="17" font-weight="600" letter-spacing="11" fill="#22d3ee">STUDIO</text>
    <rect x="220" y="288" width="380" height="2" rx="1" fill="url(#rule)"/>
    <text x="220" y="322" font-family="Inter" font-size="20" font-weight="450" fill="#a9b6c9">Search, scan and export without the cloud.</text>
    <text x="220" y="352" font-family="Inter" font-size="20" font-weight="450" fill="#67748a">Launcher · OCR · Word &amp; Excel</text>

    <g transform="rotate(-6 1012 196)">
      <rect x="908" y="46" width="208" height="276" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    </g>
    <g>
      <rect x="872" y="62" width="224" height="286" rx="16" fill="#f4f7fb"/>
      <rect x="892" y="88" width="124" height="9" rx="4.5" fill="#8b98ab"/>
      <rect x="892" y="104" width="78" height="6" rx="3" fill="#c3ccd9"/>
      <rect x="892" y="130" width="184" height="1.5" fill="#dfe6ef"/>
      <rect x="892" y="146" width="164" height="5" rx="2.5" fill="#ccd5e1"/>
      <rect x="892" y="160" width="150" height="5" rx="2.5" fill="#ccd5e1"/>
      <rect x="892" y="174" width="168" height="5" rx="2.5" fill="#ccd5e1"/>
      <rect x="892" y="188" width="112" height="5" rx="2.5" fill="#ccd5e1"/>
      <rect x="892" y="212" width="184" height="26" fill="#e9eef6"/>
      <g stroke="#d5deea" stroke-width="1.4" fill="none">
        <rect x="892" y="212" width="184" height="108"/>
        <path d="M892 238h184M892 264h184M892 290h184"/>
        <path d="M980 212v108M1030 212v108"/>
      </g>
      <rect x="872" y="192" width="224" height="18" fill="#22d3ee" fill-opacity="0.14"/>
      <rect x="872" y="199" width="224" height="3" rx="1.5" fill="url(#beam)"/>
    </g>

    <circle cx="1004" cy="30" r="3" fill="#22d3ee" fill-opacity="0.8"/>
    <circle cx="1148" cy="150" r="2" fill="#a78bfa" fill-opacity="0.8"/>
    <circle cx="820" cy="360" r="2" fill="#67e8f9" fill-opacity="0.6"/>
    <rect x="0.5" y="0.5" width="1199" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
